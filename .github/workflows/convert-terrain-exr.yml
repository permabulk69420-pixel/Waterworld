name: Convert terrain EXR maps

on:
  push:
    paths:
      - '.github/workflows/convert-terrain-exr.yml'
      - 'public/assets/textures/terrain/coast_land_rocks_01_nor_gl_1k.exr'
      - 'public/assets/textures/terrain/coast_land_rocks_01_rough_1k.exr'

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert EXR maps to runtime PNGs
        shell: bash
        run: |
          set -euo pipefail
          cd public/assets/textures/terrain
          ffmpeg -hide_banner -loglevel error -y \
            -i coast_land_rocks_01_nor_gl_1k.exr \
            -frames:v 1 coast_land_rocks_01_nor_gl_1k.png
          ffmpeg -hide_banner -loglevel error -y \
            -i coast_land_rocks_01_rough_1k.exr \
            -frames:v 1 coast_land_rocks_01_rough_1k.png

      - name: Commit converted runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/textures/terrain/coast_land_rocks_01_nor_gl_1k.png
          git add public/assets/textures/terrain/coast_land_rocks_01_rough_1k.png
          git rm public/assets/textures/terrain/coast_land_rocks_01_nor_gl_1k.exr
          git rm public/assets/textures/terrain/coast_land_rocks_01_rough_1k.exr
          git commit -m 'Convert terrain EXR maps to PNG'
          git push
