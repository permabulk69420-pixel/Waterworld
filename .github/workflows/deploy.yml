name: Deploy to GitHub Pages

# WebXR requires a secure context, so the headset needs an HTTPS URL to enter
# VR. This publishes the Vite build to GitHub Pages.

on:
  push:
    # The visuals branch publishes too, so the water/sky work can be tried on
    # the headset before it is merged. Pages only hosts one site, so whichever
    # of these pushed last is what the Quest will load - drop the branch from
    # this list once it has merged.
    branches: [main, claude/quest3-water-sky-visuals-crwo0n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # During rapid Quest prototyping, Pages should reflect main even when a
      # non-runtime TypeScript/verification check is being iterated on. Vite's
      # production build still catches syntax/module/bundling failures.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
